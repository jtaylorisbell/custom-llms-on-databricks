# Databricks AI Runtime (`air`) workload spec: run ONLY the `register` step on a
# serverless GPU node.
#
# Why remote: our custom-LLM served entity can only deploy as an *express deployment*,
# which requires `env_pack='databricks_model_serving'` at register time. env_pack packs
# the current Python environment as the serving image and can ONLY be produced on a
# Databricks serverless GPU runtime — not a laptop. `air run` executes this code on the
# serverless-GPU client image, where `is_in_databricks_serverless_runtime()` is True, so
# model.py's env_pack gate fires and MLflow auth switches to ambient job credentials
# (no ~/.databrickscfg / no profile on the node).
#
# stage / deploy / smoke stay local. Run this, then locally:
#   multi-adapter-serve --config config.yaml --steps deploy,smoke
# See air/README.md for the full one-liner and prerequisites.

# air requires a simple alnum/hyphen/underscore experiment name (NOT a workspace path).
experiment_name: multi_lora_vllm_register

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

environment:
  # Serverless environment version 4 (Python 3.12.3).
  version: "4"
  # Mirror pyproject.toml's runtime dependencies so `pip install -e .` resolves on the
  # node. vLLM is Linux-gated in pyproject; the serverless node is Linux, so it is listed
  # unconditionally here. Versions are kept in lockstep with pyproject.toml.
  dependencies:
    - "mlflow[databricks]==3.12.0"
    - "vllm==0.11.2"
    - "transformers==4.57.6"
    - "huggingface-hub>=0.34.0,<1.0"
    - "databricks-sdk>=0.102.0"
    - "fastapi>=0.138.0"
    - "httpx>=0.28.1"
    - "pydantic>=2"
    - "uvicorn>=0.49.0"
    - "pyyaml>=6.0.3"

code_source:
  # Snapshot the current project directory (this repo, incl. config.yaml + src/) onto
  # the node so `pip install -e .` and the CLI have the package to install and run.
  type: snapshot
  snapshot:
    root_path: .

command: |
  # Resolve the snapshot's project root BEFORE installing/running. On air serverless-GPU
  # nodes the extracted code_source is NOT guaranteed to be the process CWD, so a bare
  # `pip install -e .` / CLI call fails with "python: can't open file ...: No such file or
  # directory". Validated live (air-reg5/reg6 runs): the snapshot mounts at
  # /databricks/code_source/<snapshot-name> with pyproject.toml one level in, so we locate
  # pyproject.toml and cd into its directory first.
  set -e
  # Primary: the known snapshot mount root.
  ROOT=$(dirname "$(find /databricks/code_source -maxdepth 3 -name pyproject.toml 2>/dev/null | head -1)")
  # Fallback 1: the process CWD (in case the snapshot IS the working dir on some runtimes).
  if [ -z "$ROOT" ] || [ ! -f "$ROOT/pyproject.toml" ]; then
    ROOT=$(dirname "$(find "$PWD" -maxdepth 3 -name pyproject.toml 2>/dev/null | head -1)")
  fi
  # Fallback 2: widen to all of /databricks in case the mount layout changes.
  if [ -z "$ROOT" ] || [ ! -f "$ROOT/pyproject.toml" ]; then
    ROOT=$(dirname "$(find /databricks -maxdepth 5 -name pyproject.toml 2>/dev/null | head -1)")
  fi
  # Fail loudly if we still can't find the project — better than a cryptic install error.
  if [ -z "$ROOT" ] || [ ! -f "$ROOT/pyproject.toml" ]; then
    echo "FATAL: could not locate the snapshot project root (no pyproject.toml under /databricks/code_source, \$PWD, or /databricks)" >&2
    exit 1
  fi
  echo "PROJECT_ROOT=$ROOT"
  cd "$ROOT"
  pip install -e .
  multi-adapter-serve --config config.yaml --steps register
