resources:
  jobs:
    multi_lora:
      name: multi_lora
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        # deploy: register + create/update the endpoint. verify: stop after the in-notebook test.
        - name: stage
          default: deploy
      tasks:
        - task_key: main
          notebook_task:
            notebook_path: ../notebooks/register.py
          environment_key: a_environment
          compute:
            hardware_accelerator: GPU_1xA10
      queue:
        enabled: true
      environments:
        - environment_key: a_environment
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
