# ---------------------------------------------------------------------------
# Example configuration for multi-adapter (multi-LoRA) serving on Databricks.
#
# Copy this file to `config.yaml` and fill in the values for your deployment.
# This is the SHARED CONTRACT consumed by `multi_adapter_serving.config.load_config`
# and by every other track. The field names below are the exact contract — do not
# rename them.
# ---------------------------------------------------------------------------

# Where the weights come from. One of: huggingface | local
#   huggingface -> base_model.ref / adapters[].ref are Hugging Face repo ids
#   local       -> they are local filesystem paths OR existing /Volumes/... UC paths
source_type: huggingface

base_model:
  # The base model that all adapters attach to.
  ref: PLACEHOLDER_BASE_MODEL_REF  # TODO: filled in by example-selection (HF repo id or UC Volume path)

adapters:
  # One entry per LoRA adapter. `name` is the logical id used in the {adapter}
  # request field; it must be unique and non-empty. There must be at least one.
  - name: adapter_a
    ref: PLACEHOLDER_ADAPTER_A_REF  # TODO: filled in by example-selection (HF repo id or path)
  - name: adapter_b
    ref: PLACEHOLDER_ADAPTER_B_REF  # TODO: filled in by example-selection (HF repo id or path)

unity_catalog:
  # Destination for staged weights and the registered model. Weights are staged
  # under /Volumes/{catalog}/{schema}/{volume}/{model_name}/...
  catalog: classic_stable_h0vpq7_catalog
  schema: default
  model_name: multi_lora_vllm
  volume: weights

serving:
  # Databricks Model Serving endpoint settings.
  endpoint_name: multi-lora-vllm
  workload_type: GPU_MEDIUM
  workload_size: Small
  scale_to_zero: true

vllm:
  # vLLM engine settings. max_loras and max_lora_rank must be > 0.
  max_loras: 4
  max_lora_rank: 16
  max_model_len: 8192

databricks:
  # OAuth config profile used for all Databricks API calls (never a PAT).
  profile: fevm-aws
