[project]
name = "multi-adapter-serving"
version = "0.1.0"
description = "Config-driven foundation for multi-LoRA (adapter) serving on Databricks with vLLM."
readme = "README.md"
authors = [
    { name = "Taylor Isbell", email = "taylor.isbell@databricks.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "databricks-sdk>=0.102.0",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.34.0,<1.0",
    "mlflow==3.12.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "transformers==4.57.6",
    "uvicorn>=0.49.0",
    "vllm==0.11.2 ; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
